version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbp_password}
      POSTGRES_DB: ${POSTGRES_DB:-cbp_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbp_user} -d ${POSTGRES_DB:-cbp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cbp_user}:${POSTGRES_PASSWORD:-cbp_password}@db:5432/${POSTGRES_DB:-cbp_db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./model_artifacts:/app/model_artifacts
      - ./data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ./model_artifacts:/app/model_artifacts
      - ./data:/app/data

volumes:
  pgdata: